<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icons/icon-192.png">

<style>
:root{
  --bg:#FFFFFF; --surface:#F3F3F6; --surface2:#FFFFFF; --ink:#111113; --muted:#8E8E96;
  --line:#E6E6EB; --accent:#FFC400; --accent-ink:#1A1600; --accent-soft:#FFF6D9; --accent-text:#8A6100;
  --danger:#C01E16; --danger-soft:#FFECEA; --ok:#0E7A3C; --ok-soft:#E6F7EE;
  --bar:rgba(255,255,255,.80); --shadow:0 6px 20px rgba(0,0,0,.10);
  --toast-bg:rgba(255,255,255,.72); --toast-fg:#111113; --toast-line:rgba(0,0,0,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E11; --surface:#1A1A20; --surface2:#24242C; --ink:#FFFFFF; --muted:#8E8E98;
    --line:#2A2A32; --accent:#FFC400; --accent-ink:#1A1600; --accent-soft:#3A2E00; --accent-text:#FFC400;
    --danger:#FF8A80; --danger-soft:#3D1512; --ok:#6FE39B; --ok-soft:#10301E;
    --bar:rgba(18,18,22,.84); --shadow:0 6px 20px rgba(0,0,0,.5);
    --toast-bg:rgba(30,30,36,.74); --toast-fg:#FFFFFF; --toast-line:rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E11; --surface:#1A1A20; --surface2:#24242C; --ink:#FFFFFF; --muted:#8E8E98;
  --line:#2A2A32; --accent:#FFC400; --accent-ink:#1A1600; --accent-soft:#3A2E00; --accent-text:#FFC400;
  --danger:#FF8A80; --danger-soft:#3D1512; --ok:#6FE39B; --ok-soft:#10301E;
  --bar:rgba(18,18,22,.84); --shadow:0 6px 20px rgba(0,0,0,.5);
  --toast-bg:rgba(30,30,36,.74); --toast-fg:#FFFFFF; --toast-line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font-family:inherit;color:inherit}
a{color:var(--accent-text)}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:200px}
.wide #app{max-width:1200px}
.top{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.top h1{font-size:18px;font-weight:800;margin:0;flex:1;text-align:center}
.icon-btn{width:40px;height:40px;border:none;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:active{background:var(--surface)}
.pad{padding:0 16px}
.card{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:14px}
.card.white{background:var(--surface2)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
.h2{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap}
.c-red{background:var(--danger-soft);color:var(--danger)}
.c-yel{background:var(--accent-soft);color:var(--accent-text)}
.c-grey{background:var(--surface2);color:var(--muted)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.btn{display:block;width:100%;min-height:54px;border:none;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:800;cursor:pointer;text-align:center;line-height:1.2;padding:8px 14px}
.btn.sec{background:var(--surface);color:var(--ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{flex:1}
.field{width:100%;min-height:52px;border:none;border-radius:16px;background:var(--surface2);padding:14px;font-size:15px;font-weight:600}
textarea.field{resize:none;line-height:1.5}
.quick{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 2px;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar,.days::-webkit-scrollbar,.board::-webkit-scrollbar{height:0}
.q{flex:0 0 auto;width:64px;text-align:center;background:none;border:none;padding:0;cursor:pointer}
.q .circ{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.q.on .circ{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.q small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:7px;line-height:1.2}
.days{display:flex;gap:9px;overflow-x:auto;padding:16px 16px 0}
.day{flex:0 0 auto;width:58px;padding:10px 0;border:none;border-radius:16px;background:var(--surface);color:var(--muted);cursor:pointer}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day b{display:block;font-size:19px;font-weight:800}
.day span{font-size:12px;font-weight:600;opacity:.8}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bar .tab{flex:1;background:none;border:none;padding:12px 0 14px;cursor:pointer;text-align:center}
.bar .tab .g{display:inline-flex;align-items:center;justify-content:center;width:50px;height:30px;border-radius:999px;color:var(--muted)}
.bar .tab .g svg{width:22px;height:22px;display:block}
.bar .tab.on .g{color:var(--accent-ink)}
.bar .tab small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}
.bar .tab.on small{color:var(--ink);font-weight:800}
.sticky-actions{position:fixed;left:0;right:0;bottom:84px;background:var(--bar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:14px 16px;z-index:20}
.sticky-actions .inner{max-width:520px;margin:0 auto}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:none}
.ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.board{display:flex;gap:12px;overflow-x:auto;padding:0 16px 10px}
.col{flex:0 0 220px;background:var(--surface);border-radius:20px;padding:14px;max-height:62vh;overflow-y:auto;scrollbar-width:none}
.col::-webkit-scrollbar{width:0}
.mini{background:var(--surface2);border-radius:14px;padding:13px;margin-top:8px}
.kpis{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.kpis::-webkit-scrollbar{height:0}
.board{scrollbar-width:none}
.kpi{flex:0 0 150px;background:var(--surface);border-radius:18px;padding:16px}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:50px;border:none;border-radius:16px;background:var(--surface2);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:800}
.sw{width:52px;height:31px;border:none;border-radius:999px;position:relative;cursor:pointer;background:var(--line);flex-shrink:0;padding:0}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on i{left:24px}
.hero{padding:28px 16px 10px}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.1}
.tick{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.ph{height:120px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-align:center;padding:10px}
.toast{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));bottom:auto;
 max-width:488px;margin:0 auto;
 background:var(--toast-bg);color:var(--toast-fg);border:1px solid var(--toast-line);
 backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
 border-radius:18px;padding:15px 18px;font-size:14px;font-weight:700;line-height:1.45;text-align:center;
 box-shadow:0 10px 32px rgba(0,0,0,.16);z-index:60;
 animation:tin .36s cubic-bezier(.2,1.15,.35,1) both}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-26px) scale(.95)}to{opacity:1;transform:none}}
@keyframes tout{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-18px) scale(.96)}}
to{opacity:1;transform:none}}
.sw i{transition:left .2s cubic-bezier(.4,0,.2,1)}
.q .circ{transform:scale(1)}
.q.on .circ{transform:scale(1.06)}
.bar .tab .g{position:relative;transition:color .24s ease}
.bar .tab .g::before{content:"";position:absolute;inset:0;border-radius:999px;background:var(--accent);
 transform:scale(.5);opacity:0;transition:transform .28s cubic-bezier(.2,1.3,.4,1),opacity .2s ease}
.bar .tab.on .g::before{transform:scale(1);opacity:1}
.bar .tab .g svg{position:relative;z-index:1}
.bar .tab small{transition:color .24s ease,opacity .24s ease;opacity:.75}
.bar .tab.on small{opacity:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 0}
.chips::-webkit-scrollbar{height:0}
.fchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:9px 14px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--accent);color:var(--accent-ink);font-weight:800}
.fchip b{font-size:11px;font-weight:800;background:var(--surface2);border-radius:999px;padding:2px 7px}
.fchip.on b{background:rgba(0,0,0,.15)}
.fbar{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.fbtn{display:flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:10px 16px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer}
.fbtn.on{background:var(--accent);color:var(--accent-ink)}
.avawrap{position:relative;width:88px;height:88px;margin:0 auto}
.avabig{width:88px;height:88px;border-radius:50%;background:var(--surface2);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;overflow:hidden}
.avabig img{width:100%;height:100%;object-fit:cover;display:block}
.cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.stars{color:var(--accent);letter-spacing:1px}
.sect{font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--muted);margin:18px 0 10px 4px}
.orow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;border:none;width:100%;text-align:left}
.orow:active{transform:scale(.985)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
 .bar,.sticky-actions,.icon-btn,.fbtn,.toast,.chips,[data-a="pdf"]{display:none!important}
 #app{padding:0;max-width:none}
 .card,.kpi,.col{break-inside:avoid;box-shadow:none}
 body{background:#fff;color:#000}
 .kpis,.board{overflow:visible}
}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.key{height:66px;border:none;border-radius:22px;background:var(--surface);color:var(--ink);font-size:26px;font-weight:700;cursor:pointer}
.key.alt{background:transparent;font-size:16px;font-weight:700;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0 26px}
.dot4{width:16px;height:16px;border-radius:50%;background:var(--surface);transition:background .18s,transform .18s}
.dot4.on{background:var(--accent);transform:scale(1.12)}
.dot4.err{background:var(--danger)}
.dot4.pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1.12)}}
.dot4.ok{background:var(--ok)}
.lidpop{animation:lidp .22s ease}
@keyframes lidp{from{transform:scale(.92);opacity:.5}to{transform:scale(1);opacity:1}}
.key:active{background:var(--accent);color:var(--accent-ink)}
.shake{animation:shk .4s}
@keyframes shk{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}
.pdfbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:none;border-radius:16px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;margin-top:18px}
</style>
</head>

function genHistory(){
 var H=[],eqs=[];
 for(var k in EQUIP)for(var i=0;i<EQUIP[k].length;i++)eqs.push({e:EQUIP[k][i],s:k});
 var crew=["Ким В.","Ахметов Е.","Нұрланов А.","Жұмабеков Д.","Петров С.","Оспанов Р."];
 var day=86400000,n=0;
 for(var d=90;d>=1;d--){
  var cnt=4+Math.floor(Math.random()*4);
  for(var j=0;j<cnt;j++){
   var pick=eqs[Math.floor(Math.random()*eqs.length)];
   // закономерность 1: конвейер К-3 ломается втрое чаще
   if(Math.random()<0.14)pick={e:"Конвейер К-3",s:"Дробление"};
   var w=crew[Math.floor(Math.random()*crew.length)];
   var planned=Math.random()<0.38;
   var code=pick.e==="Конвейер К-3"&&!planned&&Math.random()<0.7?"М-02":CODES[Math.floor(Math.random()*CODES.length)].c;
   // закономерность 2: у Петрова С. втрое больше возвратов
   var rework=Math.random()<(w==="Петров С."?0.26:0.06);
   var hour=6+Math.floor(Math.random()*18);
   var norm=0;for(var q=0;q<CODES.length;q++)if(CODES[q].c===code)norm=CODES[q].norm*60;
   var min=Math.round(norm*(0.6+Math.random()*0.9));
   // закономерность 3: ночью перерасход масла по шифру Г-04
   var oil=(code==="Г-04")?(hour>=22||hour<6?2+Math.round(Math.random()*3):2):0;
   H.push({n:++n,e:pick.e,s:pick.s,c:code,w:w,p:planned,r:rework,m:min,h:hour,
    o:oil,ts:nowMs()-d*day,sc:rework?3:(Math.random()<0.6?5:4)});
  }
 }
 return H;
}

 checks.push({ok:full?1:0,t:S.lang==="en"?"Completeness":S.lang==="kk"?"Толықтығы":"Полнота закрытия",
  n:full?(S.lang==="en"?"works, code, materials, photo filled in":S.lang==="kk"?"жұмыс, шифр, материал, фото толтырылған":"работы, шифр, материалы, фото заполнены")
       :(S.lang==="en"?"some fields are empty":S.lang==="kk"?"кейбір өрістер бос":"часть полей не заполнена")});
 if(!full){score-=1;}
 var kw=o.prob.toLowerCase(),wk=o.works.toLowerCase(),match=false;
 var pairs=[["теч","прокладк"],["теч","сальник"],["подшипник","подшипник"],["вибрац","крепёж"],["вибрац","крепеж"],["напряж","кабель"],["лент","лент"],["лампы","лампы"],["привод","привод"],["выключател","выключател"]];
 for(var i=0;i<pairs.length;i++){if(kw.indexOf(pairs[i][0])>=0&&wk.indexOf(pairs[i][1])>=0)match=true;}
 if(wk.length>25&&!match)match=wk.indexOf("замен")>=0||wk.indexOf("ремонт")>=0||wk.length>60;
 checks.push({ok:match?1:0,t:S.lang==="en"?"Work matches the problem":S.lang==="kk"?"Жұмыс ақаулыққа сәйкес":"Соответствие работ проблеме",
  n:match?(S.lang==="en"?"described work addresses the fault":S.lang==="kk"?"сипатталған жұмыс ақаулықты жояды":"описанные работы устраняют неисправность")
        :(S.lang==="en"?"description is too vague for the fault":S.lang==="kk"?"сипаттама тым жалпы":"описание слишком общее для этой неисправности")});
 if(!match)score-=1;
 var over=null;
 for(var j=0;j<o.mats.length;j++){var m=o.mats[j];var ref=null;
  for(var k=0;k<MATS.length;k++)if(MATS[k].n===m.n)ref=MATS[k];
  if(ref&&m.q>ref.norm*1.5)over=m.n+" — "+m.q+" "+m.u+" ("+(S.lang==="en"?"usual":S.lang==="kk"?"әдетте":"обычно")+" "+ref.norm+")";}
 checks.push({ok:over?0:1,t:S.lang==="en"?"Materials make sense":S.lang==="kk"?"Материал логикасы":"Логичность материалов",
  n:over||(S.lang==="en"?"consumption within the usual range":S.lang==="kk"?"шығын қалыпты шекте":"расход в пределах нормы")});
 if(over)score-=1;
 var cd=null;for(var q=0;q<CODES.length;q++)if(CODES[q].c===o.code)cd=CODES[q];
 var spent=o.started?Math.max(1,Math.round((nowMs()-o.started)/60000)):40;
 var normMin=(cd?cd.norm:2)*60, inTime=spent<=normMin;
 checks.push({ok:inTime?1:0,t:S.lang==="en"?"Time":S.lang==="kk"?"Уақыт":"Время",
  n:spent+" "+t("mins")+" / "+(S.lang==="en"?"norm":S.lang==="kk"?"норма":"норматив")+" "+(cd?cd.norm:2)+" "+t("hrs")});
 if(!inTime)score-=1;
 checks.push({ok:o.photo?1:0,t:S.lang==="en"?"Photo quality":S.lang==="kk"?"Фото сапасы":"Качество по фото",
  n:o.photo?(S.lang==="en"?"same unit, fault no longer visible, confidence 0.87":S.lang==="kk"?"сол жабдық, ақаулық көрінбейді, сенім 0.87":"то же оборудование, неисправность не видна, уверенность 0.87")
          :(S.lang==="en"?"no after photo":S.lang==="kk"?"«кейін» фото жоқ":"нет фото «после»")});
 if(!o.photo)score-=1;
 if(score<1)score=1;
 var v=score>=5?"ok":score>=3?"warn":"redo";
 var title=v==="ok"?(S.lang==="en"?"Accepted":S.lang==="kk"?"Қабылданды":"Принято")
  :v==="warn"?(S.lang==="en"?"Accepted with remarks":S.lang==="kk"?"Ескертумен қабылданды":"Принято с замечаниями")
  :(S.lang==="en"?"Needs rework":S.lang==="kk"?"Пысықтауды қажет етеді":"Требует доработки");
 var bad=[];for(var z=0;z<checks.length;z++)if(!checks[z].ok)bad.push(checks[z].n);
 var text=bad.length?bad.join("; ")+"."
  :(S.lang==="en"?"Everything checks out: work matches the fault, consumption and time are normal."
   :S.lang==="kk"?"Барлығы дұрыс: жұмыс ақаулыққа сәйкес, шығын мен уақыт қалыпты."
   :"Всё в порядке: работы соответствуют неисправности, расход и время в норме.");
 return {score:score,kind:v,title:title,text:text,checks:checks,spent:spent};
}

function pct(a,b){return b?Math.round(a*100/b):0;}
function crewStats(){
 var map={};
 for(var i=0;i<S.hist.length;i++){var r=S.hist[i];
  if(!map[r.w])map[r.w]={w:r.w,n:0,sc:0,re:0,ot:0};
  var m=map[r.w];m.n++;m.sc+=r.sc;if(r.r)m.re++;
  var norm=0;for(var q=0;q<CODES.length;q++)if(CODES[q].c===r.c)norm=CODES[q].norm*60;
  if(r.m<=norm)m.ot++;}
 var L=[];
 for(var k in map){var m=map[k];
  m.avg=(m.sc/m.n);m.onTime=pct(m.ot,m.n);m.rework=pct(m.re,m.n);
  m.score=Math.round(m.avg/5*40+m.onTime*0.3+(100-m.rework)*0.2+Math.min(m.n,120)/120*10);
  var c=null;for(var z=0;z<CREW.length;z++)if(CREW[z].n===m.w)c=CREW[z];
  m.spec=c?c.s:"";L.push(m);}
 L.sort(function(a,b){return b.score-a.score;});
 return L;
}

  h+='<button class="tab'+(on?" on":"")+'" data-tab="'+d.v+'" data-a="go" data-v="'+d.v+'">'+
   '<span class="g">'+d.f(on)+'</span><small>'+d.l+'</small></button>';}

function syncBar(active){
 var nav=document.getElementById("nav");if(!nav)return;
 var bar=nav.querySelector(".bar");if(!bar)return;
 var D=barDefs(),tabs=bar.querySelectorAll(".tab");
 for(var i=0;i<tabs.length&&i<D.length;i++){

function canNotify(){try{return typeof Notification!=="undefined";}catch(e){return false;}}

  toast(S.notifOk?(S.lang==="en"?"Notifications enabled":S.lang==="kk"?"Хабарламалар қосылды":"Уведомления включены")
   :(S.lang==="en"?"Permission denied":S.lang==="kk"?"Рұқсат берілмеді":"Разрешение не выдано"));
 }).catch(function(){});
}
function notify(title,body){
 if(!S.push)return;
 try{
  if(canNotify()&&Notification.permission==="granted"){
   var n=new Notification(title,{body:body,tag:"worko",icon:""});
   setTimeout(function(){try{n.close();}catch(e){}},8000);
  }
  if(navigator.vibrate)navigator.vibrate([120,60,120]);
 }catch(e){}
}

  html+='<span class="dot4 '+cls+'"></span>';}

 c.className="dots";if(S.pinErr){void c.offsetWidth;c.className="dots shake";}

  :(S.lang==="en"?"Enter your 4-digit PIN":S.lang==="kk"?"4 таңбалы ПИН енгізіңіз":"Введите 4-значный ПИН");

function shrink(file,cb){
 var fr=new FileReader();
 fr.onload=function(ev){var img=new Image();
  img.onload=function(){try{
   var mx=640,k=Math.min(1,mx/Math.max(img.width,img.height));
   var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL("image/jpeg",0.72));}catch(err){cb(null);}};
  img.src=ev.target.result;};
 fr.readAsDataURL(file);
}
document.addEventListener("change",function(e){
 if(e.target.id==="photofile"&&e.target.files&&e.target.files[0]){
  var o=get(S.cur);syncClose(o);
  shrink(e.target.files[0],function(d){
   if(!d){toast("Ошибка фото");return;}
   if(!o.photos)o.photos=[];o.photos.push(d);o.photo=true;save();render();
   toast(S.lang==="en"?"Photo attached":S.lang==="kk"?"Фото тіркелді":"Фото прикреплено");
   if(ONLINE&&o.dbid){
    try{
     var bin=atob(d.split(",")[1]),arr=new Uint8Array(bin.length);
     for(var bi=0;bi<bin.length;bi++)arr[bi]=bin.charCodeAt(bi);
     var path=o.dbid+"/after-"+Date.now()+".jpg";
     DB.storage.from("order-photos").upload(path,new Blob([arr],{type:"image/jpeg"}))
      .then(function(){DB.from("order_photos").insert({order_id:o.dbid,phase:"after",
        path:path,author_id:S.empId}).then(function(){},function(){});},function(){});
    }catch(err){}
   }});
  return;}
 if(e.target.id==="avafile"&&e.target.files&&e.target.files[0]){
  var fr=new FileReader();
  fr.onload=function(ev){
   var img=new Image();
   img.onload=function(){
    try{
     var sz=220,c=document.createElement("canvas");c.width=sz;c.height=sz;
     var k=Math.min(img.width,img.height);
     c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,sz,sz);
